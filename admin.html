</div>

<div id="info" class="card" style="background:#e8f5ff;font-size:12px"></div>
<div id="lista"></div>

<script>
let dados = null;
let siteOriginal = null;

function badge(url){
  if(!url) return '';
  const u=url.toLowerCase();
  if(u.includes('tiktok')) return '<span class="badge badge-tiktok">TikTok</span>';
  if(u.includes('youtu')) return '<span class="badge badge-yt">YouTube</span>';
  if(u.includes('instagram')) return '<span class="badge badge-insta">Instagram</span>';
  if(u.includes('facebook')||u.includes('fb.watch')) return '<span class="badge badge-face">Facebook</span>';
  return '<span class="badge" style="background:#0f1e3d">Link</span>';
}

async function carregarOriginal(){
  try{
    const r = await fetch('data/site.json',{cache:'no-store'});
    if(!r.ok) throw 'sem arquivo';
    siteOriginal = await r.json();
    dados = JSON.parse(JSON.stringify(siteOriginal));
    render();
  }catch(e){
    alert('Não achei data/site.json, carregando modelo local');
    // fallback
    dados = {
      empresa:{nome:"BelartGesso",whatsapp:"5511976983978",telefone:"5511976983978",url:"https://belartgesso.github.io/BelartGesso/",logo:"imagens/logo-belartgesso.jpg",redes:{tiktok:"https://www.tiktok.com/@belartgesso347"}},
      areas:["Itanhaém","Mongaguá","Praia Grande"],
      hero:{eyebrow:"Gesso e drywall na Baixada Santista",title:"Acabamento que valoriza o ambiente.",text:"Forros, sancas, drywall, iluminação e detalhes em gesso"},
      services:[],
      portfolio:[],
      reviews:[],
      faq:[]
    };
    render();
  }
}

function render(){
  if(!dados) return;
  const p = dados.portfolio||[];
  document.getElementById('info').innerHTML = `<b>Empresa:</b> ${dados.empresa?.nome||''} | <b>Portfolio:</b> ${p.length} itens (${p.filter(x=>x.tipo==='video-url').length} vídeos) | <b>TikTok:</b> ${dados.empresa?.redes?.tiktok||'@belartgesso347'}`;
  
  document.getElementById('lista').innerHTML = p.map((item,i)=>`
  <div class="card">
    <div style="display:flex;justify-content:space-between"><b>#${i+1} - ${item.tipo||'foto'}</b><div>${badge(item.url)} <span class="small">${(item.arquivo||'').slice(0,20)} ${(item.url||'').slice(0,35)}</span></div></div>
    <div class="row" style="margin-top:8px">
      <input value="${item.arquivo||''}" placeholder="Arquivo: foto.jpg (deixe vazio se for link)" class="input" oninput="dados.portfolio[${i}].arquivo=this.value">
      <button onclick="document.getElementById('f${i}').click()" style="padding:10px 14px;background:#f5e6c8;border:1px solid #ddd;border-radius:10px;font-weight:700">📁 Local</button>
      <input type="file" id="f${i}" style="display:none" accept="image/*,video/*" onchange="filePick(this,${i})">
    </div>
    <div class="urlbox">
      <div style="font-size:11px;font-weight:800;color:#7a5d00">🔗 LINK DO VÍDEO - TikTok / YouTube / Instagram / Facebook / Kwai</div>
      <input value="${item.url||''}" placeholder="Cole link: https://www.tiktok.com/@belartgesso347/video/..." class="input" style="margin-top:6px" oninput="dados.portfolio[${i}].url=this.value; if(this.value) dados.portfolio[${i}].tipo='video-url'; renderLista()">
      <div class="small">TikTok: ${item.plataforma||'tiktok'} - Copie link no app > Compartilhar > Copiar link</div>
    </div>
    <div style="background:#eef7ff;border:1px solid #cfe5ff;border-radius:12px;padding:10px;margin:8px 0">
      <div style="font-size:11px;font-weight:800;color:#245b8f">🖼️ MINIATURA DO VÍDEO</div>
      <input value="${item.miniatura||''}" placeholder="Nome do arquivo da miniatura em imagens/ (ex.: miniatura-forro.jpg)" class="input" style="margin-top:6px" oninput="dados.portfolio[${i}].miniatura=this.value">
      <div class="small">A miniatura deve estar na pasta <b>imagens/</b> do GitHub. Ex.: imagens/miniatura-forro.jpg</div>
    </div>
    <input value="${item.titulo||item.legenda||''}" placeholder="Título / Legenda" class="input" oninput="dados.portfolio[${i}].titulo=this.value">
    <div class="row">
      <input value="${item.categoria||''}" placeholder="Categoria: Forros, Sancas, Drywall, Iluminação" class="input" oninput="dados.portfolio[${i}].categoria=this.value">
      <input value="${item.cidade||''}" placeholder="Cidade: Itanhaém, Mongaguá..." class="input" oninput="dados.portfolio[${i}].cidade=this.value">
      <select onchange="dados.portfolio[${i}].tipo=this.value" class="input"><option value="foto" ${!item.tipo||item.tipo==='foto'?'selected':''}>Foto</option><option value="video" ${item.tipo==='video'?'selected':''}>Vídeo local</option><option value="video-url" ${item.tipo==='video-url'?'selected':''}>Vídeo rede social</option><option value="antes-depois" ${item.tipo==='antes-depois'?'selected':''}>Antes/depois</option></select>
      <button onclick="dados.portfolio.splice(${i},1);render()" style="padding:10px 14px;background:#ff4d4d;color:#fff;border:0;border-radius:10px">X</button>
    </div>
  </div>`).join('');
}

function renderLista(){ // só atualiza badges sem re-render total pesado
  localStorage.setItem('site_json_backup', JSON.stringify(dados));
}

function filePick(input, idx){
  const file=input.files[0]; if(!file) return;
  const nome=file.name.toLowerCase().replace(/\s+/g,'-');
  dados.portfolio[idx].arquivo=nome;
  dados.portfolio[idx].url='';
  dados.portfolio[idx].tipo=file.type.startsWith('video')?'video':'foto';
  render();
  alert('Escolhido: '+nome+'\nSuba esse arquivo em imagens/ do GitHub!');
}

function add(tipo){
  if(!dados) dados={empresa:{},areas:[],hero:{},services:[],portfolio:[],reviews:[],faq:[]};
  if(!dados.portfolio) dados.portfolio=[];
  if(tipo==='tiktok') dados.portfolio.push({arquivo:"",titulo:"🎵 TikTok @belartgesso347",categoria:"Forros",cidade:"Itanhaém",tipo:"video-url",url:"https://www.tiktok.com/@belartgesso347/video/",plataforma:"tiktok"});
  else if(tipo==='youtube') dados.portfolio.push({arquivo:"",titulo:"▶️ YouTube - Forro de gesso",categoria:"Forros",cidade:"Itanhaém",tipo:"video-url",url:"https://youtu.be/",plataforma:"youtube"});
  else if(tipo==='instagram') dados.portfolio.push({arquivo:"",titulo:"📸 Instagram Reels",categoria:"Forros",cidade:"Itanhaém",tipo:"video-url",url:"https://www.instagram.com/reel/",plataforma:"instagram"});
  else if(tipo==='facebook') dados.portfolio.push({arquivo:"",titulo:"👍 Facebook Reels",categoria:"Forros",cidade:"Itanhaém",tipo:"video-url",url:"https://www.facebook.com/",plataforma:"facebook"});
  render();
}

function baixar(){
  if(!dados){alert('Nada carregado');return;}
  const blob=new Blob([JSON.stringify(dados,null,2)],{type:"application/json"});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="site.json";a.click();
}

// auto carrega
carregarOriginal();
</script>
</body>
</html>
