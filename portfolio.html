let DADOS = null;
async function carregarDados(){
  const urls = ['./trabalhos.json','./trabalhos-v2.json','data/site.json'];
  for(let url of urls){
    try{
      const res = await fetch(url+'?v='+Date.now());
      if(res.ok){ DADOS = await res.json(); if(DADOS.portfolio){ // convert old format
        DADOS.itens = DADOS.portfolio.map(p=>({tipo:p.tipo==='video-url'?'tiktok':p.tipo, arquivo:p.arquivo, id:p.url ? (p.url.split('/video/')[1]||'').split('?')[0] : '', legenda:p.titulo, categoria:p.categoria, cidade:p.cidade}));
      } console.log('Carregado de',url); break;}
    }catch(e){}
  }
  if(!DADOS){ DADOS = DADOS_FALLBACK; }
  renderPortfolio('Todos');
}
function renderPortfolio(filtro){
  const grid = document.getElementById('portfolio-grid');
  if(!grid || !DADOS.itens) return;
  let itens = DADOS.itens;
  if(filtro !== 'Todos'){
    itens = itens.filter(i => {
      if(filtro === 'Fotos') return i.tipo === 'foto';
      if(filtro === 'Vídeos') return ['video','youtube','tiktok','instagram','video-url'].includes(i.tipo);
      if(filtro === 'TikTok') return i.tipo === 'tiktok';
      return i.categoria === filtro;
    });
  }
  grid.innerHTML = itens.map(item => {
    let midia = '';
    if(item.tipo === 'foto'){
      midia = `<img src="./imagens/${item.arquivo}" alt="${item.legenda}" onerror="this.parentElement.innerHTML='🏗️'">`;
    }else if(item.tipo === 'video'){
      midia = `<video src="./imagens/${item.arquivo}" controls muted></video>`;
    }else if(item.tipo === 'youtube'){
      midia = `<iframe src="https://www.youtube.com/embed/${item.id}" allowfullscreen style="width:100%;height:100%;border:0"></iframe>`;
    }else if(item.tipo === 'tiktok'){
      const url = item.url || `https://www.tiktok.com/@belartgesso347/video/${item.id}`;
      midia = `<a href="${url}" target="_blank" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;text-decoration:none"><div style="font-size:40px">🎵</div><div style="font-size:12px;font-weight:800;margin-top:8px">TikTok<br>${item.id}<br>▶ Ver vídeo</div></a>`;
    }else if(item.tipo === 'instagram'){
      midia = `<div style="display:flex;align-items:center;justify-content:center;height:100%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);color:#fff">Instagram<br>${item.id}</div>`;
    }else{
      midia = '🏗️';
    }
    const badge = item.tipo==='tiktok'?'TikTok':item.tipo==='foto'?'Foto':item.tipo;
    return `<div class="p-item"><div class="p-midia"><span class="badge-top">${badge}</span>${midia}</div><div class="p-info"><span>${item.categoria||item.tipo} • ${item.cidade||''}</span><p>${item.legenda||''}</p></div></div>`;
  }).join('');
  document.querySelectorAll('#filtros button').forEach(b=>b.classList.toggle('ativo', b.dataset.filtro===filtro));
}
document.addEventListener('click', e=>{
  const btn = e.target.closest('[data-filtro]');
  if(btn) renderPortfolio(btn.dataset.filtro);
});
document.addEventListener('DOMContentLoaded', carregarDados);
</script>
